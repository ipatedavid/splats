<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="robots" content="noindex" />
        <title>Not found</title>
        <!-- With this file, Cloudflare Pages answers a missing address with a real 404 instead of
             the homepage, so the player's checks for optional files (a skybox, a poster) see
             that they are missing. -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&display=swap" />
        <style>
            :root {
                color-scheme: light;
            }
            body {
                margin: 0;
                min-height: 100vh;
                display: grid;
                place-content: center;
                gap: 20px;
                padding: 0 24px;
                background: #f3efe8;
                color: #161412;
                font: 400 17px/1.6 'Geist', 'Helvetica Neue', Arial, sans-serif;
                text-align: center;
            }
            h1 {
                margin: 0;
                font-size: clamp(2rem, 5vw, 3.2rem);
                font-weight: 400;
                letter-spacing: -0.035em;
                line-height: 1.05;
            }
            a {
                justify-self: center;
                padding: 14px 26px;
                border-radius: 999px;
                background: #161412;
                color: #f3efe8;
                text-decoration: none;
            }
            a:hover,
            a:focus-visible {
                background: #b5532f;
            }
        </style>
    </head>
    <body>
        <h1>This page isn't here.</h1>
        <a href="/">Back to Forma Spatial</a>
    </body>
</html>

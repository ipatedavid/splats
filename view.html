<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
        />
        <title>Splat viewer</title>
        <link rel="stylesheet" href="./index.css" />
        <style>
            html,
            body {
                height: 100%;
                margin: 0;
                overflow: hidden;
                background: #111;
            }
            /* A scene locked to one camera mode has no mode switch. */
            body.gs-locked .sse-buttonGroup:has(.sse-orbitCamera),
            body.gs-locked .sse-walkShortcut {
                display: none !important;
            }
            .gs-back {
                position: fixed;
                top: calc(env(safe-area-inset-top, 0px) + 12px);
                left: 12px;
                z-index: 10;
                padding: 6px 12px;
                border-radius: 999px;
                background: rgba(18, 18, 20, 0.62);
                color: #f2f2f2;
                font: 500 13px/1.2 system-ui, sans-serif;
                text-decoration: none;
                backdrop-filter: blur(6px);
            }
            .gs-back:hover,
            .gs-back:focus-visible {
                background: rgba(18, 18, 20, 0.85);
                outline: 2px solid rgba(255, 255, 255, 0.5);
                outline-offset: 1px;
            }
            .gs-message {
                position: fixed;
                inset: 0;
                display: grid;
                place-items: center;
                margin: 0;
                padding: 24px;
                color: #d8d8d8;
                font: 16px/1.5 system-ui, sans-serif;
                text-align: center;
            }
        </style>
        <script src="./config.js"></script>
    </head>
    <body>
        <script type="module">
            import { createViewer, defaultSettings } from './index.js';
            import { sceneFolder, loadScene } from './scene.js';

            const message = (text) => {
                const p = document.createElement('p');
                p.className = 'gs-message';
                p.textContent = text;
                document.body.append(p);
            };

            const params = new URL(location.href).searchParams;

            // a way back to the portfolio, except when the scene is embedded in another page
            if (window.top === window.self) {
                const back = document.createElement('a');
                back.className = 'gs-back';
                back.href = './';
                back.textContent = '← All work';
                document.body.append(back);
            }
            const folder = sceneFolder(params);
            if (!folder) {
                message('No scene chosen. Add ?scene=name to the address.');
            } else {
                try {
                    const scene = await loadScene(folder, defaultSettings);
                    document.body.classList.toggle('gs-locked', Boolean(scene.limits?.mode));
                    window.viewer = await createViewer({
                        container: document.body,
                        settings: scene.settings,
                        contentUrl: scene.contentUrl,
                        collisionUrl: scene.collisionUrl,
                        skyboxUrl: scene.skyboxUrl,
                        posterUrl: scene.posterUrl,
                        limits: scene.limits,
                        renderer: params.has('webgl') ? 'webgl' : 'webgpu'
                    });
                } catch (error) {
                    message(`This scene could not be loaded. ${error.message}`);
                }
            }
        </script>
    </body>
</html>

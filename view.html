<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <script>
            // The site moved to formaspatial.com; the old GitHub Pages address forwards there.
            if (location.hostname === 'ipatedavid.github.io') {
                location.replace(`https://formaspatial.com${location.pathname.replace(/^\/splats/, '')}${location.search}${location.hash}`);
            }
        </script>
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
        />
        <title>Splat viewer</title>
        <link rel="stylesheet" href="./index.css" />
        <style>
            html,
            body {
                height: 100%;
                margin: 0;
                overflow: hidden;
                background: #111;
            }
            /* A scene locked to its camera modes shows only their switches (none for one mode),
               and its animation is the Tour pill rather than play, pause and a timeline. */
            body.gs-locked:not(.gs-several) .sse-buttonGroup:has(.sse-orbitCamera),
            body.gs-locked:not(.gs-orbit) .sse-orbitCamera,
            body.gs-locked:not(.gs-fly) .sse-flyCamera,
            body.gs-locked:not(.gs-walk) .sse-fpsCamera,
            body.gs-locked:not(.gs-walk) .sse-walkShortcut,
            body.gs-locked .sse-playShortcut,
            body.gs-locked .sse-buttonGroup:has(.sse-play),
            body.gs-locked .sse-timelineContainer {
                display: none !important;
            }
            .gs-back {
                position: fixed;
                top: calc(env(safe-area-inset-top, 0px) + 12px);
                left: 12px;
                z-index: 10;
                padding: 6px 12px;
                border-radius: 999px;
                background: rgba(18, 18, 20, 0.62);
                color: #f2f2f2;
                font: 500 13px/1.2 system-ui, sans-serif;
                text-decoration: none;
                backdrop-filter: blur(6px);
            }
            .gs-back:hover,
            .gs-back:focus-visible {
                background: rgba(18, 18, 20, 0.85);
                outline: 2px solid rgba(255, 255, 255, 0.5);
                outline-offset: 1px;
            }
            [hidden] {
                display: none !important;
            }
            /* Pills at the top right: the tour, and the visitor's height in walk mode. */
            .gs-pills {
                position: fixed;
                top: calc(env(safe-area-inset-top, 0px) + 12px);
                right: 12px;
                z-index: 10;
                display: flex;
                gap: 8px;
                align-items: center;
            }
            .gs-tour {
                min-height: 40px;
                padding: 0 16px;
                border: 0;
                border-radius: 999px;
                background: rgba(18, 18, 20, 0.62);
                backdrop-filter: blur(6px);
                color: #f2f2f2;
                font: 500 13px/1.2 system-ui, sans-serif;
                cursor: pointer;
            }
            .gs-tour:hover,
            .gs-tour:focus-visible {
                background: rgba(18, 18, 20, 0.85);
                outline: 2px solid rgba(255, 255, 255, 0.5);
                outline-offset: 1px;
            }
            /* Walk mode: the visitor's height sets their eye level. One pill: closed it shows the
               height, open it becomes the field, the unit switch, reset and close. */
            .gs-height {
                display: flex;
                align-items: center;
                gap: 2px;
                padding: 2px;
                border-radius: 999px;
                background: rgba(18, 18, 20, 0.62);
                backdrop-filter: blur(6px);
                font: 500 13px/1.2 system-ui, sans-serif;
                color: #f2f2f2;
            }
            .gs-height button,
            .gs-height input {
                font: inherit;
                color: inherit;
                border: 0;
                background: transparent;
                min-height: 36px;
                min-width: 36px;
                padding: 0 12px;
                border-radius: 999px;
            }
            .gs-height button {
                cursor: pointer;
            }
            .gs-height button:hover,
            .gs-height button:focus-visible,
            .gs-height input:focus-visible {
                background: rgba(255, 255, 255, 0.14);
                outline: none;
            }
            .gs-height .edit {
                display: flex;
                align-items: center;
                gap: 2px;
            }
            .gs-height input {
                width: 3.6em;
                padding: 0 6px;
                text-align: right;
                background: rgba(255, 255, 255, 0.1);
                font-variant-numeric: tabular-nums;
                -moz-appearance: textfield;
            }
            .gs-height input::-webkit-inner-spin-button,
            .gs-height input::-webkit-outer-spin-button {
                -webkit-appearance: none;
                margin: 0;
            }
            .gs-height #gs-height-ft,
            .gs-height #gs-height-in {
                width: 2.4em;
            }
            .gs-height .unit {
                padding: 0 4px 0 2px;
                color: #b8b8b8;
            }
            .gs-height .switch {
                border: 1px solid rgba(255, 255, 255, 0.35);
                min-height: 30px;
                padding: 0 10px;
            }
            .gs-height .icon {
                padding: 0;
                font-size: 16px;
            }
            /* A soft glow at the screen's edges while the camera is pressed past the scene's
               boundary, so visitors feel why it slows and springs back. */
            .gs-edge {
                position: fixed;
                inset: 0;
                z-index: 5;
                pointer-events: none;
                opacity: 0;
                transition: opacity 0.25s ease-out;
                box-shadow: inset 0 0 90px 24px rgba(255, 255, 255, 0.28);
            }
            /* The collision view is a tool for the editor, not for visitors. */
            .sse-showCollisionRow,
            .sse-showCollisionShortcut {
                display: none !important;
            }
            .gs-message {
                position: fixed;
                inset: 0;
                display: grid;
                place-items: center;
                margin: 0;
                padding: 24px;
                color: #d8d8d8;
                font: 16px/1.5 system-ui, sans-serif;
                text-align: center;
            }
        </style>
        <script src="./config.js"></script>
    </head>
    <body>
        <script type="module">
            import { createViewer, defaultSettings } from './index.js';
            import { sceneFolder, loadScene } from './scene.js';

            const message = (text) => {
                const p = document.createElement('p');
                p.className = 'gs-message';
                p.textContent = text;
                document.body.append(p);
            };

            const read = (key) => {
                try {
                    return JSON.parse(localStorage.getItem(key));
                } catch {
                    return null;
                }
            };
            const write = (key, value) => {
                try {
                    localStorage.setItem(key, JSON.stringify(value));
                } catch {
                    // private window: the height lasts for this visit only
                }
            };

            const pills = document.createElement('div');
            pills.className = 'gs-pills';

            // The camera modes a scene's limits allow, starting mode first; null for all of them.
            const allowedModes = (limits) => {
                if (!limits?.mode && !limits?.modes?.length) return null;
                const modes = limits.modes?.length ? [...limits.modes] : [limits.mode];
                return limits.mode ? [limits.mode, ...modes.filter((m) => m !== limits.mode)] : modes;
            };

            // A scene locked to its modes offers its animation as a tour: off until a visitor
            // starts it; it ends back in the mode they were in (stopping it, touching the view,
            // or the end of the track). Other scenes keep the viewer's own play button.
            const tourControl = (viewer, modes) => {
                if (!modes) return;
                let before = modes[0];
                const button = document.createElement('button');
                button.type = 'button';
                button.className = 'gs-tour';
                pills.append(button);
                const touring = () => viewer.state.cameraMode === 'anim';
                const update = () => {
                    button.hidden = !viewer.state.hasAnimation;
                    button.textContent = touring() ? '■ Stop tour' : '▶ Tour';
                    button.setAttribute('aria-pressed', String(touring()));
                    button.title = touring() ? 'Stop the tour' : 'Play a short tour of the scene';
                };
                button.addEventListener('click', () => {
                    if (touring()) {
                        viewer.state.cameraMode = before;
                        return;
                    }
                    before = viewer.state.cameraMode;
                    const { animationTime, animationDuration } = viewer.state;
                    if (animationDuration > 0 && animationTime >= animationDuration - 0.05) {
                        viewer.seek(0); // a finished tour starts again from the beginning
                    }
                    viewer.state.cameraMode = 'anim';
                    viewer.state.animationPaused = false;
                });
                viewer.events.on('cameraMode:changed', update);
                viewer.events.on('hasAnimation:changed', update);
                update();
            };

            // In walk mode visitors can give their height, so they see the scene from their own
            // eye level. Kept in this browser, in metres; shown in cm or feet and inches.
            const heightControl = (viewer) => {
                const saved = read('gs-visitor-height') ?? {};
                let height = Number.isFinite(saved.height) ? saved.height : null;
                let unit = saved.unit === 'ft' ? 'ft' : 'cm';

                const box = document.createElement('div');
                box.className = 'gs-height';
                box.innerHTML = `
                    <button type="button" class="toggle" aria-expanded="false" title="Walk at your own eye level"></button>
                    <div class="edit" hidden>
                        <span data-for="cm"><input id="gs-height-cm" type="number" inputmode="numeric" min="90" max="230" step="1" aria-label="Your height in centimetres" /><span class="unit">cm</span></span>
                        <span data-for="ft"><input id="gs-height-ft" type="number" inputmode="numeric" min="3" max="7" step="1" aria-label="Feet" /><span class="unit">ft</span><input id="gs-height-in" type="number" inputmode="numeric" min="0" max="11" step="1" aria-label="Inches" /><span class="unit">in</span></span>
                        <button type="button" class="switch"></button>
                        <button type="button" class="icon reset" title="Default height" aria-label="Default height">↺</button>
                        <button type="button" class="icon close" title="Close" aria-label="Close">✕</button>
                    </div>`;
                pills.append(box);
                const toggle = box.querySelector('.toggle');
                const edit = box.querySelector('.edit');
                const unitSwitch = box.querySelector('.switch');
                const cm = box.querySelector('#gs-height-cm');
                const ft = box.querySelector('#gs-height-ft');
                const inch = box.querySelector('#gs-height-in');

                // typing a height must not walk the camera
                box.addEventListener('keydown', (event) => {
                    event.stopPropagation();
                    if (event.key === 'Escape' || event.key === 'Enter') open(false);
                });
                box.addEventListener('keyup', (event) => event.stopPropagation());

                const feet = (m) => {
                    const inches = Math.round(m / 0.0254);
                    return [Math.floor(inches / 12), inches % 12];
                };
                const label = () => {
                    if (height === null) return 'Your height';
                    if (unit === 'cm') return `Height ${Math.round(height * 100)} cm`;
                    const [f, i] = feet(height);
                    return `Height ${f}′${i}″`;
                };
                const show = () => {
                    toggle.textContent = label();
                    unitSwitch.textContent = unit === 'cm' ? 'ft' : 'cm';
                    unitSwitch.setAttribute('aria-label', unit === 'cm' ? 'Switch to feet' : 'Switch to centimetres');
                    for (const part of box.querySelectorAll('[data-for]')) part.hidden = part.dataset.for !== unit;
                    const h = height ?? 1.7;
                    if (document.activeElement !== cm) cm.value = Math.round(h * 100);
                    const [f, i] = feet(h);
                    if (document.activeElement !== ft) ft.value = f;
                    if (document.activeElement !== inch) inch.value = i;
                };
                const apply = (metres) => {
                    height = metres === null ? null : Math.min(Math.max(metres, 0.9), 2.3);
                    viewer.setVisitorHeight(height);
                    write('gs-visitor-height', { height, unit });
                    show();
                };
                const open = (yes) => {
                    edit.hidden = !yes;
                    toggle.hidden = yes;
                    toggle.setAttribute('aria-expanded', String(yes));
                    show();
                };

                toggle.addEventListener('click', () => open(true));
                box.querySelector('.close').addEventListener('click', () => open(false));
                document.addEventListener('pointerdown', (event) => {
                    if (!edit.hidden && !box.contains(event.target)) open(false);
                });
                unitSwitch.addEventListener('click', () => {
                    unit = unit === 'cm' ? 'ft' : 'cm';
                    write('gs-visitor-height', { height, unit });
                    show();
                });
                const number = (input) => (input.value === '' ? NaN : Number(input.value));
                cm.addEventListener('input', () => {
                    const v = number(cm);
                    if (v >= 90 && v <= 230) apply(v / 100);
                });
                const fromFeet = () => {
                    const f = number(ft);
                    const i = inch.value === '' ? 0 : number(inch);
                    const m = (f * 12 + i) * 0.0254;
                    if (Number.isFinite(m) && m >= 0.9 && m <= 2.3) apply(m);
                };
                ft.addEventListener('input', fromFeet);
                inch.addEventListener('input', fromFeet);
                box.querySelector('.reset').addEventListener('click', () => apply(null));

                // only offered while walking
                const update = () => {
                    box.hidden = viewer.state.cameraMode !== 'walk';
                    if (box.hidden) open(false);
                };
                viewer.events.on('cameraMode:changed', update);
                if (height !== null) viewer.setVisitorHeight(height);
                show();
                update();
            };

            const params = new URL(location.href).searchParams;

            // a way back to the portfolio, except when the scene is embedded in another page
            if (window.top === window.self) {
                const back = document.createElement('a');
                back.className = 'gs-back';
                back.href = './';
                back.textContent = '← All work';
                document.body.append(back);
            }
            const folder = sceneFolder(params);
            if (!folder) {
                message('No scene chosen. Add ?scene=name to the address.');
            } else {
                try {
                    const scene = await loadScene(folder, defaultSettings);
                    const modes = allowedModes(scene.limits);
                    document.body.classList.toggle('gs-locked', Boolean(modes));
                    document.body.classList.toggle('gs-several', (modes?.length ?? 0) > 1);
                    for (const mode of ['orbit', 'walk', 'fly']) {
                        document.body.classList.toggle(`gs-${mode}`, Boolean(modes?.includes(mode)));
                    }
                    window.viewer = await createViewer({
                        container: document.body,
                        settings: scene.settings,
                        contentUrl: scene.contentUrl,
                        collisionUrl: scene.collisionUrl,
                        skyboxUrl: scene.skyboxUrl,
                        posterUrl: scene.posterUrl,
                        // always an object: annotation limits apply only when the viewer has one
                        limits: scene.limits ?? {},
                        renderer: params.has('webgl') ? 'webgl' : 'webgpu'
                    });
                    document.body.append(pills);
                    // the collision view's keyboard shortcut still works; keep it off
                    window.viewer.events.on('collisionOverlayEnabled:changed', (on) => {
                        if (on) window.viewer.state.collisionOverlayEnabled = false;
                    });
                    const edge = document.createElement('div');
                    edge.className = 'gs-edge';
                    document.body.append(edge);
                    window.viewer.events.on('edgePressure:changed', (pressure) => {
                        // clearly there as soon as the edge resists, stronger the further out
                        edge.style.opacity = pressure > 0.01 ? String(Math.min(1, 0.3 + Math.sqrt(pressure))) : '0';
                    });
                    tourControl(window.viewer, modes);
                    heightControl(window.viewer);
                } catch (error) {
                    message(`This scene could not be loaded. ${error.message}`);
                }
            }
        </script>
    </body>
</html>

<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <title>Splats</title>
        <script>
            // Old links went to index.html?scene=…; the player is view.html now.
            if (new URLSearchParams(location.search).has('scene')) {
                location.replace(`view.html${location.search}`);
            }
        </script>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap"
        />
        <link rel="stylesheet" href="./portfolio.css" />
    </head>
    <body>
        <div class="wrap">
            <header class="mast">
                <p class="eyebrow">Gaussian splats · walk inside them</p>
                <h1 id="name">Splats</h1>
                <p id="tagline" class="tagline"></p>
                <p id="intro" class="intro"></p>
                <nav id="links" class="links" aria-label="Links"></nav>
            </header>
            <main>
                <ul id="scenes" class="grid" aria-label="Scenes"></ul>
                <p id="empty" class="empty" hidden></p>
            </main>
            <footer>
                <p>
                    Captured with a camera, turned into splats on rented GPUs, shown with the open-source
                    SuperSplat viewer. Drag to look around; on a phone, use one finger to turn and two to zoom.
                </p>
            </footer>
        </div>
        <script type="module" src="./portfolio.js"></script>
    </body>
</html>
